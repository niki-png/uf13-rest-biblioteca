spring.application.name=biblioteca

# configurazione usata SOLO dai test (sovrascrive quella di src/main/resources)
# database H2 in memoria in modalità compatibile MySQL: i test non richiedono MySQL attivo
# NON_KEYWORDS=YEAR perché la colonna "year" della tabella books è una parola chiave in H2
spring.datasource.url=jdbc:h2:mem:biblioteca_test;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
